<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Household Budget Tracker</h1>
        </header>

        <section class="card" id="setup-zone">
            <h2>Set Monthly Budget</h2>
            <div class="input-group">
                <input type="number" id="budget-input" placeholder="Enter total budget (e.g., 1000)" min="1">
                <button id="set-budget-btn">Set Budget</button>
            </div>
        </section>

        <section class="card dashboard" id="dashboard-zone">
            <h2>Remaining Balance</h2>
            <div id="balance-container" class="balance neutral">
                $<span id="remaining-display">0.00</span>
            </div>
            <div class="budget-summary">
                Initial Budget: $<span id="total-display">0.00</span>
            </div>
        </section>

        <section class="card" id="expense-zone">
            <h2>Log New Expense</h2>
            <div class="form-container">
                <div class="input-field">
                    <label for="expense-user">Spent By:</label>
                    <select id="expense-user">
                        <option value="Me">Me</option>
                        <option value="Partner">Partner</option>
                    </select>
                </div>

                <div class="input-field">
                    <label for="expense-name">Item Name:</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries, Dinner">
                </div>

                <div class="input-field">
                    <label for="expense-amount">Amount ($):</label>
                    <input type="number" id="expense-amount" placeholder="0.00" min="0.01" step="0.01">
                </div>

                <button id="add-expense-btn" class="btn-block">Add Expense</button>
            </div>

            <hr>

            <h2>Expense History</h2>
            <ul id="history-list">
                </ul>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
